<section class="dental-team">
  <div class="dental-team__header">
    {{#if kicker}}
    <div class="dental-services__kicker">{{kicker}}</div>
    {{/if}}
    <h2 class="dental-services__title">{{title}}</h2>
    <p class="dental-services__subtitle">{{subtitle}}</p>
  </div>
  <div class="dental-team__grid">
    {{#each members}}
    <div class="dental-team-card">
      {{#if photo.src}}
      <img src="{{photo.src}}" alt="{{photo.alt}}" class="dental-team-card__photo" loading="lazy" />
      {{/if}}
      <div class="dental-team-card__content">
        <h3 class="dental-team-card__name">{{name}}</h3>
        <div class="dental-team-card__role">{{role}}</div>
        <p class="dental-team-card__bio">{{bio}}</p>
      </div>
    </div>
    {{/each}}
  </div>
</section>
